[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/groq-chat"
  to = "/.netlify/functions/groq-chat"
  status = 200

[[redirects]]
  from = "/api/test-smtp"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
